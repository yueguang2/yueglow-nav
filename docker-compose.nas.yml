services:
  yueglow-nav:
    image: 2192098715/yueglow-nav:latest
    container_name: yueglow-nav
    restart: unless-stopped
    ports:
      - "40331:3000"
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
      APP_COOKIE_SECURE: "false"
      LAZYCAT_OIDC_LOGIN_ENABLED: "false"
      LAZYCAT_PASSWORDLESS_LOGIN_ENABLED: "false"
    volumes:
      - yueglow-nav-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  yueglow-nav-data:
