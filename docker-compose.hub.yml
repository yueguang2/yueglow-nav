services:
  yueglow-nav:
    image: 2192098715/yueglow-nav:latest
    container_name: yueglow-nav
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
      APP_COOKIE_SECURE: "${APP_COOKIE_SECURE:-true}"
      LAZYCAT_OIDC_LOGIN_ENABLED: "${LAZYCAT_OIDC_LOGIN_ENABLED:-false}"
      LAZYCAT_PASSWORDLESS_LOGIN_ENABLED: "${LAZYCAT_PASSWORDLESS_LOGIN_ENABLED:-false}"
      APP_BASE_URL: "${APP_BASE_URL:-}"
      SMART_LINK_PROBE_ALLOWED_HOSTS: "${SMART_LINK_PROBE_ALLOWED_HOSTS:-}"
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
